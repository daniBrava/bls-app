name: Test and build

on:
  push:
    branches: [main]
  workflow_dispatch:

# The app is served by Cloudflare Pages (https://bls-app.pages.dev), which builds from this repo.
# This workflow only checks every push: extraction tests + a full build (card checks).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test extraction
        run: node app/tests/extract.test.js
      - name: Build (validates cards, embeds data)
        run: python3 app/build.py
